name: Release - Desktop Multi-Platform

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux'
            os: 'ubuntu-22.04'
          - platform: 'windows'
            os: 'windows-latest'
          - platform: 'macos'
            os: 'macos-latest'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Go Agent (Linux/macOS)
        if: matrix.platform != 'windows'
        working-directory: agent
        run: go build -trimpath -ldflags="-s -w" -o ../src-tauri/binaries/midorivpn-agent ./cmd/agent || true

      - name: Build Go Agent (Windows)
        if: matrix.platform == 'windows'
        working-directory: agent
        run: go build -trimpath -ldflags="-s -w" -o ../src-tauri/binaries/midorivpn-agent.exe ./cmd/agent || true

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Midori VPN Desktop ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }} of Midori VPN Desktop client.'
          releaseDraft: false
          prerelease: false
