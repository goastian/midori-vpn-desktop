name: Release - Desktop Linux RPM

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux-rpm:
    name: Build Desktop Linux RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout the project license
        uses: actions/checkout@v6
        with:
          repository: goastian/midorivpn-core
          path: .release-license
          sparse-checkout: LICENSE
          persist-credentials: false

      - name: Install rootless Podman and RPM signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman rpm gnupg

      - name: Import RPM signing key
        env:
          RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
        run: printf '%s' "$RPM_SIGNING_PRIVATE_KEY" | gpg --batch --import

      - name: Build and sign Linux RPM in rootless Podman
        env:
          MIDORIVPN_LICENSE_FILE: ${{ github.workspace }}/.release-license/LICENSE
          RPM_SIGNING_KEY_ID: ${{ secrets.RPM_SIGNING_KEY_ID }}
        run: bash scripts/build-rpm.sh

      - name: Generate checksums
        run: sha256sum dist-packages/*.rpm dist-packages/RPM-GPG-KEY-midorivpn > dist-packages/SHA256SUMS

      - name: Publish Linux RPM release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-packages/*.rpm
            dist-packages/RPM-GPG-KEY-midorivpn
            dist-packages/SHA256SUMS
          generate_release_notes: true
