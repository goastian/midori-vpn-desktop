name: CI - Desktop App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-agent:
    name: Test Go Agent
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum

      - name: Run Go Agent Tests
        working-directory: agent
        run: go vet ./... && go test -v -race ./...

      - name: Run Staticcheck on Agent
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          working-directory: agent
          version: "2026.1"
          install-go: false

      - name: Run Govulncheck on Agent
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27.x'
          work-dir: agent
          go-package: ./...

  test-frontend:
    name: Frontend Lint, TypeCheck & Vitest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run Vitest Suite
        run: npm test

      - name: Run ESLint with zero warnings
        run: npm run lint

      - name: Build frontend check
        run: npm run build
