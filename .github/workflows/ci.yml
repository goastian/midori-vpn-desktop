name: CI - Desktop App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-agent:
    name: Test Go Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum

      - name: Run Go Agent Tests
        working-directory: agent
        run: go vet ./... && go test -v -race ./...

      - name: Run Staticcheck on Agent
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          working-directory: agent
          version: "2026.1"
          install-go: false

      - name: Run Govulncheck on Agent
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '1.27.x'
          work-dir: agent
          go-package: ./...

  test-frontend:
    name: Frontend Lint, TypeCheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run Vitest Suite
        run: npm test

      - name: Run ESLint with zero warnings
        run: npm run lint

      - name: Build frontend check
        run: npm run build
