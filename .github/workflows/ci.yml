name: CI - Desktop App

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-agent:
    name: Test Go Agent
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: agent/go.sum

      - name: Run Go Agent Tests
        working-directory: agent
        run: go vet ./... && go test -v -race ./...

      - name: Run Staticcheck on Agent
        working-directory: agent
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      - name: Run Govulncheck on Agent
        working-directory: agent
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  test-frontend:
    name: Frontend Lint, TypeCheck & Vitest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run Vitest Suite
        run: npm test

      - name: Run ESLint with zero warnings
        run: npm run lint

      - name: Build frontend check
        run: npm run build
